services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orgstructure
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: orgpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orgstructure"]
      interval: 3s
      timeout: 5s
      retries: 12

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: orgstructure
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: orgpass
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
